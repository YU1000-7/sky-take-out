spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:sky;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

springfox:
  documentation:
    enabled: false
    swagger-ui:
      enabled: false

knife4j:
  enable: false

sky:
  order:
    # 测试里不跑定时任务，超时取消由用例直接调用 service 方法验证
    auto-cancel:
      enabled: false

logging:
  level:
    root: warn
